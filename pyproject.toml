[project]
name = "cartelera"
version = "0.1.0"
description = "Cartelera de cines de Buenos Aires para los próximos 10 días"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    "pypdf>=7.1.0",
    "selectolax>=1.0.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
